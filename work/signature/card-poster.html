<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Inter:wght@400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c1a2a;--ivory:#f4efe6;--brass:#b9945a;--ink:#1c2430}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1536px;height:1024px;background:var(--ivory);font-family:Inter,sans-serif;color:var(--navy)}
.card{position:relative;width:1536px;height:1024px;display:flex;align-items:center;padding:0 90px 0 70px;gap:0}
.photo{width:490px;height:490px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 10px 40px rgba(12,26,42,.10)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;filter:grayscale(1)}
.rule{width:2px;height:540px;background:var(--brass);margin:0 56px 0 72px;flex:none}
.info{flex:1;padding-top:6px}
h1{font-family:"Playfair Display",serif;font-weight:500;font-size:108px;line-height:1;letter-spacing:-.01em;color:var(--navy)}
.role{font-family:"Playfair Display",serif;font-weight:400;font-size:46px;white-space:nowrap;line-height:1.1;margin-top:18px;color:var(--navy)}
.role .sep{color:var(--brass);margin:0 16px;font-weight:300}
ul{list-style:none;margin-top:42px;display:flex;flex-direction:column;gap:22px}
li{display:flex;align-items:center;gap:30px;font-size:32px;font-weight:400;color:var(--navy);letter-spacing:.005em}
li svg{width:40px;height:40px;flex:none;stroke:var(--brass);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tag{display:flex;align-items:center;gap:30px;margin-top:56px}
.tag .line{width:110px;height:2px;background:var(--brass)}
.tag span{font-family:Archivo,sans-serif;white-space:nowrap;font-size:20px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}
</style></head><body><div class="card">
<div class="photo"><img src="pfp.png"></div>
<div class="rule"></div>
<div class="info">

<div class="role">Movement Leader<span class="sep">|</span>Club Vanguard</div>

<li><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 7 9 6.5L21 7"/></svg>misha@clubvanguard.com</li>
<li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg>www.clubvanguard.com</li>
<li><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.3v.1M12 17v-3.8a2.3 2.3 0 0 1 4.6 0V17M12 10.5V17"/></svg>linkedin.com/in/mishafedorov</li>

</ul>

</div></div></body></html>
